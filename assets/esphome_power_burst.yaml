# Merge this example into the ESPHome node that owns the power meter.

sensor:
  - platform: <YOUR_POWER_METER>
    id: dyson_energy_monitor
    update_interval: 2s
    power:
      name: Dyson Power

script:
  - id: dyson_power_feedback_burst
    mode: restart
    then:
      - component.resume:
          id: dyson_energy_monitor
          update_interval: 500ms
      - component.update: dyson_energy_monitor
      - delay: 10s
      - component.resume:
          id: dyson_energy_monitor
          update_interval: 2s

button:
  - platform: template
    name: Power Feedback Burst
    entity_category: diagnostic
    on_press:
      - script.execute: dyson_power_feedback_burst
