name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    name: Pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.8.0", "latest"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: |
          python -m pip install --upgrade pip
          pip install uv
          if [ "$HA_VERSION" = "latest" ]; then
            uv pip install --system homeassistant pytest pytest-homeassistant-custom-component ruff
          else
            uv pip install --system "homeassistant==$HA_VERSION" pytest pytest-homeassistant-custom-component ruff
          fi

      - name: Run Ruff lint
        run: ruff check custom_components tests

      - name: Check Ruff formatting
        run: ruff format --check custom_components tests

      - name: Run tests
        run: pytest -q -W error
